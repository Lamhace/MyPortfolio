<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top Ambient Glow -->
  <circle cx="400" cy="80" r="140" fill="#10B981" opacity="0.12" filter="url(#glow)" />
  <circle cx="680" cy="240" r="100" fill="#8B5CF6" opacity="0.08" filter="url(#glow)" />

  <!-- Window Chrome / App Container -->
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="48" rx="16" fill="#0E131F" />
  <circle cx="78" cy="64" r="5" fill="#EF4444" />
  <circle cx="96" cy="64" r="5" fill="#F59E0B" />
  <circle cx="114" cy="64" r="5" fill="#10B981" />

  <!-- Window Header Logo -->
  <rect x="145" y="53" width="22" height="22" rx="6" fill="url(#emeraldGrad)" />
  <path d="M152 59 L160 64 L152 69 Z" fill="#0B0F17" />
  <text x="176" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.2px">PromptSmith Studio</text>
  <rect x="312" y="56" width="94" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
  <text x="322" y="69" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5px">ENTERPRISE AI</text>

  <!-- Left Card: Prompt Quality Radar -->
  <rect x="75" y="110" width="280" height="270" rx="12" fill="#0B0F17" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="95" y="136" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5px">PROMPT QUALITY AUDIT</text>
  
  <!-- Score Circle -->
  <circle cx="215" cy="200" r="42" fill="none" stroke="#1F2937" stroke-width="8" />
  <circle cx="215" cy="200" r="42" fill="none" stroke="#10B981" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="36" stroke-linecap="round" />
  <text x="215" y="206" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle">94</text>
  <text x="215" y="222" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">OPTIMIZED</text>

  <!-- Metric Bars -->
  <text x="95" y="272" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Clarity &amp; Persona</text>
  <text x="325" y="272" fill="#34D399" font-family="monospace" font-size="11" text-anchor="end">98%</text>
  <rect x="95" y="278" width="230" height="4" rx="2" fill="#1F2937" />
  <rect x="95" y="278" width="225" height="4" rx="2" fill="#10B981" />

  <text x="95" y="306" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Guardrails &amp; Constraints</text>
  <text x="325" y="306" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="end">95%</text>
  <rect x="95" y="312" width="230" height="4" rx="2" fill="#1F2937" />
  <rect x="95" y="312" width="218" height="4" rx="2" fill="#38BDF8" />

  <text x="95" y="340" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Output Schema Adherence</text>
  <text x="325" y="340" fill="#A855F7" font-family="monospace" font-size="11" text-anchor="end">100%</text>
  <rect x="95" y="346" width="230" height="4" rx="2" fill="#1F2937" />
  <rect x="95" y="346" width="230" height="4" rx="2" fill="#A855F7" />

  <!-- Right Card: Optimized Prompt Output & Code -->
  <rect x="375" y="110" width="345" height="270" rx="12" fill="#0B0F17" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Right Card Tabs -->
  <rect x="390" y="125" width="90" height="22" rx="6" fill="#10B981" opacity="0.15" />
  <text x="435" y="139" fill="#34D399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">STRUCTURED</text>
  <text x="515" y="139" fill="#6B7280" font-family="monospace" font-size="10">RAW TEXT</text>
  <text x="590" y="139" fill="#6B7280" font-family="monospace" font-size="10">API CODE</text>

  <!-- Structured Code Display -->
  <rect x="390" y="158" width="315" height="205" rx="8" fill="#070A0F" stroke="rgba(255,255,255,0.05)" />
  <text x="405" y="180" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">[SYSTEM ROLE]</text>
  <text x="405" y="196" fill="#9CA3AF" font-family="monospace" font-size="10">You are a Principal Software Engineer...</text>
  
  <text x="405" y="222" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">[NEGATIVE CONSTRAINTS]</text>
  <text x="405" y="238" fill="#F87171" font-family="monospace" font-size="10">• Never output conversational preamble</text>
  <text x="405" y="252" fill="#F87171" font-family="monospace" font-size="10">• Do not omit error handling or type definitions</text>

  <text x="405" y="278" fill="#FBBF24" font-family="monospace" font-size="10" font-weight="700">[OUTPUT SPECIFICATION]</text>
  <text x="405" y="294" fill="#D1D5DB" font-family="monospace" font-size="10">Return RFC 8259-compliant JSON Schema</text>

  <rect x="405" y="312" width="285" height="36" rx="6" fill="#111827" stroke="rgba(16,185,129,0.3)" />
  <text x="420" y="333" fill="#6EE7B7" font-family="monospace" font-size="10">⚡ 1-Click Export to OpenAI, Gemini &amp; Python</text>
</svg>
